name: Release Creation

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read # Required for the changelog builder to see PRs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # 1. Automated Changelog Builder (Builds notes from your merged PRs/Issues)
      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Code
        run: npm run build

      - name: Update Manifest, Changelog, and Push
        id: update_changelog
        run: |
          VER="${{ steps.get_version.outputs.VERSION }}"
          REPO="${{ github.repository }}"
          DATE=$(date -u +"%Y-%m-%d")

          # 1. Update module.json
          jq --arg ver "$VER" --arg repo "$REPO" \
            '.version = $ver | 
             .manifest = "https://github.com/" + $repo + "/releases/latest/download/module.json" | 
             .download = "https://github.com/" + $repo + "/releases/download/v" + $ver + "/pf2e-auto-action-tracker.zip" |
             .changelog = "https://github.com/" + $repo + "/blob/main/CHANGELOG.md"' \
             module.json > temp.json && mv temp.json module.json

          # 2. Extract commit messages since last tag (excluding automated [skip ci] commits)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMIT_NOTES=$(git log "${LAST_TAG}..HEAD" --grep="\[skip ci\]" --invert-grep --pretty=format:"%B" | sed '/^[[:space:]]*$/N;/^\n$/D')
          fi
          if [ -z "$COMMIT_NOTES" ]; then
            COMMIT_NOTES=$(git log -1 --pretty=%B)
          fi

          # Save notes for the GitHub Release body
          EOF_MARKER="EOF_$(date +%s)"
          echo "NOTES<<$EOF_MARKER" >> $GITHUB_OUTPUT
          echo "$COMMIT_NOTES" >> $GITHUB_OUTPUT
          echo "$EOF_MARKER" >> $GITHUB_OUTPUT

          # 3. Prepend new version section to CHANGELOG.md if not already present
          VER="$VER" DATE="$DATE" COMMIT_NOTES="$COMMIT_NOTES" node -e '
            const fs = require("fs");
            const ver = process.env.VER;
            const date = process.env.DATE;
            const notes = (process.env.COMMIT_NOTES || "").trim();
            const header = "# Changelog\n\nAll notable changes to **PF2E Automated Action Tracker** are documented in this file.\n";
            let content = fs.existsSync("CHANGELOG.md") ? fs.readFileSync("CHANGELOG.md", "utf8") : header;
            if (!content.includes(`## [v${ver}]`)) {
              const entry = `\n## [v${ver}] - ${date}\n${notes}\n`;
              const firstSectionIdx = content.indexOf("\n## ");
              if (firstSectionIdx !== -1) {
                content = content.slice(0, firstSectionIdx) + entry + content.slice(firstSectionIdx);
              } else {
                content = content.trimEnd() + "\n" + entry;
              }
              fs.writeFileSync("CHANGELOG.md", content, "utf8");
            }
          '

          # 4. Configure Git & Push back to main
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add module.json CHANGELOG.md
          if ! git diff-index --quiet HEAD; then
            # [skip ci] is vital to prevent the action from triggering itself
            git commit -m "chore: update manifest and changelog to v$VER [skip ci]"
            git push origin main
          else
            echo "No changes to module.json or CHANGELOG.md detected. Skipping git commit and push."
          fi

      - name: Create ZIP
        run: |
          mkdir -p pf2e-auto-action-tracker
          cp -r dist/* pf2e-auto-action-tracker/
          cp module.json README.md CHANGELOG.md pf2e-auto-action-tracker/
          zip -r pf2e-auto-action-tracker.zip pf2e-auto-action-tracker/

      # 2. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: v${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.update_changelog.outputs.NOTES || steps.github_release.outputs.changelog }}
          files: |
            module.json
            pf2e-auto-action-tracker.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to FoundryVTT
        uses: cs96and/FoundryVTT-release-package@v1.0.2
        if: always() && steps.github_release.outcome == 'success' # Only run if the release worked
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        with:
          package-token: ${{ secrets.PACKAGE_TOKEN }}
          manifest-url: https://github.com/${{ github.repository }}/releases/download/v${{ steps.get_version.outputs.VERSION }}/module.json